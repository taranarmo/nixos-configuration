name: Build and Cache NixOS Configurations

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      host:
        description: "Specific host to build (leave empty for all)"
        required: false
        default: ""
        type: string

concurrency:
  group: build-and-cache-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CACHIX_NAME: ${{ vars.CACHIX_NAME || 'taranarmo' }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.nixos-cuda.org https://cache.flox.dev https://hyprland.cachix.org https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
            max-jobs = 2
            cores = 4
            min-free = 5368709120
            max-free = 16106127360

      - name: Determine Cachix capabilities
        id: cachix-mode
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_NAME_VAR: ${{ vars.CACHIX_NAME }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ -n "${CACHIX_AUTH_TOKEN:-}" ] || [ -n "${CACHIX_NAME_VAR:-}" ]; then
            echo "can_use=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_use=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${CACHIX_AUTH_TOKEN:-}" ] && { [ "${GITHUB_EVENT_NAME}" != "pull_request" ] || [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ]; }; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Cachix
        if: steps.cachix-mode.outputs.can_use == 'true'
        uses: cachix/cachix-action@v16
        with:
          name: ${{ env.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Preserve upstream substituters
        run: |
          if [ -f "$HOME/.config/nix/nix.conf" ]; then
            sed -i -E 's/^[[:space:]]*substituters[[:space:]]*=/extra-substituters =/; s/^[[:space:]]*trusted-public-keys[[:space:]]*=/extra-trusted-public-keys =/' "$HOME/.config/nix/nix.conf"
          fi
          echo "Active substituters: $(nix config show substituters)"
          echo "Active trusted-public-keys: $(nix config show trusted-public-keys)"

      - name: Build all NixOS configurations
        env:
          INPUT_HOST: ${{ inputs.host }}
          CAN_PUSH: ${{ steps.cachix-mode.outputs.can_push }}
        run: |
          df -h /
          all_hosts=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)
          if [ -n "$INPUT_HOST" ]; then
            if ! echo "$all_hosts" | jq -e --arg h "$INPUT_HOST" 'index($h) != null' >/dev/null; then
              echo "Unknown host '$INPUT_HOST'. Available hosts: $all_hosts" >&2
              exit 1
            fi
            hosts=("$INPUT_HOST")
          else
            mapfile -t hosts < <(echo "$all_hosts" | jq -r '.[]')
          fi

          targets=()
          for h in "${hosts[@]}"; do
            targets+=(".#nixosConfigurations.${h}.config.system.build.toplevel")
          done
          printf '%s\n' "${hosts[@]}" > /tmp/built-hosts.txt
          echo "Building targets: ${targets[*]}"

          if [ "$CAN_PUSH" = "true" ]; then
            cachix watch-exec --watch-mode post-build-hook "$CACHIX_NAME" -- \
              nix build "${targets[@]}" --no-link --keep-going -L
          else
            nix build "${targets[@]}" --no-link --keep-going -L
          fi

          for h in "${hosts[@]}"; do
            nix build ".#nixosConfigurations.${h}.config.system.build.toplevel" --out-link "/tmp/new-${h}"
          done

      - name: Diff closures, comment on PR, and mark ready
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_READY_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
        run: |
          mapfile -t hosts < /tmp/built-hosts.txt
          DIX="$(nix build --no-link --print-out-paths ".#nixosConfigurations.${hosts[0]}.pkgs.dix")/bin/dix"

          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/base "$BASE_SHA"
          trap 'git worktree remove --force /tmp/base 2>/dev/null || true' EXIT

          base_hosts=$(nix eval "path:/tmp/base#nixosConfigurations" --apply builtins.attrNames --json)
          base_targets=()
          for h in "${hosts[@]}"; do
            if echo "$base_hosts" | jq -e --arg h "$h" 'index($h) != null' >/dev/null; then
              base_targets+=("path:/tmp/base#nixosConfigurations.${h}.config.system.build.toplevel")
            fi
          done
          if [ "${#base_targets[@]}" -gt 0 ]; then
            nix build "${base_targets[@]}" --no-link --keep-going
            for h in "${hosts[@]}"; do
              if echo "$base_hosts" | jq -e --arg h "$h" 'index($h) != null' >/dev/null; then
                nix build "path:/tmp/base#nixosConfigurations.${h}.config.system.build.toplevel" --out-link "/tmp/old-${h}"
              fi
            done
          fi

          {
            printf '@%s All NixOS configurations built and cached for `%s`. Marking PR ready for review.\n\n' "$REPO_OWNER" "${HEAD_SHA:0:7}"
            printf '### Package changes (`dix diff`)\n\n'
            for h in "${hosts[@]}"; do
              if [ ! -e "/tmp/old-${h}" ]; then
                printf -- '- **%s**: new host added in this PR.\n\n' "$h"
                continue
              fi
              diff_out=$("$DIX" --color=never diff "/tmp/old-${h}" "/tmp/new-${h}")
              if [ -z "$diff_out" ]; then
                diff_out="No package changes."
              fi
              size_line=$(printf '%s\n' "$diff_out" | grep -E '^SIZE:' | tail -n1 || true)
              if [ "${#diff_out}" -gt 16000 ]; then
                diff_out="${diff_out:0:16000}"$'\n... (truncated)'
              fi
              if [ -n "$size_line" ]; then
                printf '<details>\n<summary><strong>%s</strong> — <code>%s</code></summary>\n\n' "$h" "$size_line"
              else
                printf '<details>\n<summary><strong>%s</strong></summary>\n\n' "$h"
              fi
              printf '```text\n%s\n```\n\n</details>\n\n' "$diff_out"
            done
          } > /tmp/pr-comment.md

          GH_TOKEN="$BOT_TOKEN" gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md

          if [ "$(GH_TOKEN="$PR_READY_TOKEN" gh pr view "$PR_NUMBER" --json isDraft -q .isDraft)" = "true" ]; then
            GH_TOKEN="$PR_READY_TOKEN" gh pr ready "$PR_NUMBER"
          fi

      - name: Report remaining disk space
        if: always()
        run: df -h /
